<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none">
  <!-- Background -->
  <rect width="600" height="380" rx="20" fill="#f8fafc"/>
  <rect x="1" y="1" width="598" height="378" rx="19" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect width="600" height="42" rx="20" fill="#ffffff"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="25" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SmartMeet AI • AI-Powered Meeting Intelligence &amp; Multi-Agent Workflows</text>
  <rect x="475" y="10" width="105" height="22" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="484" y="25" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="9" font-weight="700">VOICE AI AGENT</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MEETING DURATION</text>
    <text x="14" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">42:15 min</text>
    <rect x="115" y="32" width="42" height="18" rx="4" fill="#f5f3ff"/>
    <text x="122" y="44" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="9" font-weight="700">LIVE</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SPEAKERS IDENTIFIED</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">4 Participants</text>
    <text x="290" y="44" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Diarized</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ACTION ITEMS EXTRACTED</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">7 Tasks</text>
    <rect x="495" y="32" width="55" height="18" rx="4" fill="#ecfdf5"/>
    <text x="502" y="44" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ASSIGNED</text>
  </g>

  <!-- Left: Live Transcription & Speaker Diarization -->
  <g transform="translate(20, 134)">
    <rect width="320" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Speech-to-Text &amp; Diarization</text>

    <!-- Utterance 1 -->
    <g transform="translate(16, 42)">
      <circle cx="14" cy="14" r="14" fill="#3b82f6"/>
      <text x="10" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">BG</text>
      <text x="36" y="12" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Bhuvan Gowda (Host)</text>
      <text x="36" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">"Let's finalize the Whisper voice agent model for edge devices."</text>
    </g>

    <!-- Utterance 2 -->
    <g transform="translate(16, 92)">
      <circle cx="14" cy="14" r="14" fill="#10b981"/>
      <text x="10" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SK</text>
      <text x="36" y="12" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Sarah Khan (Lead ML)</text>
      <text x="36" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">"Agreed, sub-100ms latency is confirmed across our cloud benchmarks."</text>
    </g>

    <!-- Utterance 3 -->
    <g transform="translate(16, 142)">
      <circle cx="14" cy="14" r="14" fill="#8b5cf6"/>
      <text x="10" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">AI</text>
      <text x="36" y="12" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SmartMeet Agent</text>
      <text x="36" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">"Noted. Action item logged for Bhuvan: Deploy edge quantization script."</text>
    </g>

    <rect x="16" y="196" width="288" height="20" rx="6" fill="#f5f3ff"/>
    <text x="24" y="210" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Live TTS &amp; STT Engine Synchronized</text>
  </g>

  <!-- Right: AI Meeting Summary & Action Items -->
  <g transform="translate(355, 134)">
    <rect width="225" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Automated AI Synthesis</text>

    <!-- Key Decisions -->
    <g transform="translate(16, 44)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="700">EXECUTIVE SUMMARY</text>
      <rect y="18" width="193" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9">Meeting approved sprint targets.</text>
      <text x="10" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Voice agent pipeline ready for rollout.</text>
    </g>

    <!-- Action Items -->
    <g transform="translate(16, 114)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ACTION ITEMS</text>
      <rect y="18" width="193" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9">☑ Bhuvan: Edge quantization</text>
      <text x="10" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9">☑ Sarah: Benchmark latency</text>
      <text x="10" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Auto-synced with Notion &amp; Jira</text>
    </g>

    <rect x="16" y="196" width="193" height="20" rx="6" fill="#ecfdf5"/>
    <text x="24" y="210" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">7 Tasks Dispatched via Webhooks</text>
  </g>
</svg>

