<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none">
  <!-- Background -->
  <rect width="600" height="380" rx="20" fill="#f8fafc"/>
  <rect x="1" y="1" width="598" height="378" rx="19" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect width="600" height="42" rx="20" fill="#ffffff"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="25" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PhishAI Guard • 6-Agent Autonomous Threat Intelligence Defense</text>
  <rect x="460" y="10" width="122" height="22" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="472" y="25" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9" font-weight="700">AGENTIC AI DEFENSE</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">THREAT RISK SCORE</text>
    <text x="14" y="48" fill="#dc2626" font-family="system-ui, sans-serif" font-size="18" font-weight="800">96 / 100</text>
    <rect x="110" y="32" width="50" height="18" rx="4" fill="#fee2e2"/>
    <text x="115" y="44" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CRITICAL</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ACTIVE AI AGENTS</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">6 / 6 Online</text>
    <text x="290" y="44" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Cooperative</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SHANNON ENTROPY</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">4.82 bits</text>
    <rect x="495" y="32" width="55" height="18" rx="4" fill="#fef3c7"/>
    <text x="502" y="44" fill="#b45309" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ANOMALY</text>
  </g>

  <!-- Left: 6-Agent Coordination Grid -->
  <g transform="translate(20, 134)">
    <rect width="320" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Coordinated Multi-Agent Threat Vectors</text>

    <g transform="translate(16, 42)">
      <!-- Agent 1 -->
      <rect width="138" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="10" y="18" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Agent 1: Typosquatting</text>
      <text x="10" y="32" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="600">⚠️ Spoofed Domain Alert</text>

      <!-- Agent 2 -->
      <rect x="150" width="138" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="160" y="18" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Agent 2: Entropy Check</text>
      <text x="160" y="32" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="600">High Obfuscation</text>

      <!-- Agent 3 -->
      <rect y="50" width="138" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="10" y="68" fill="#065f46" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Agent 3: DKIM / SPF</text>
      <text x="10" y="82" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Cryptographic Pass</text>

      <!-- Agent 4 -->
      <rect x="150" y="50" width="138" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="160" y="68" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Agent 4: IOC Matching</text>
      <text x="160" y="82" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Known C2 Server Match</text>

      <!-- Agent 5 -->
      <rect y="98" width="138" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="10" y="116" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Agent 5: URL Payload</text>
      <text x="10" y="130" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Credential Harvester</text>

      <!-- Agent 6 -->
      <rect x="150" y="98" width="138" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="160" y="116" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Agent 6: Anomaly AI</text>
      <text x="160" y="130" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Behavioral Deviation</text>
    </g>

    <rect x="16" y="196" width="288" height="20" rx="6" fill="#fee2e2"/>
    <text x="24" y="210" fill="#991b1b" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Zero-Day Threat Quarantined &amp; Network Gate Armed</text>
  </g>

  <!-- Right: Weighted Risk Ensemble -->
  <g transform="translate(355, 134)">
    <rect width="225" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Weighted Risk Ensemble</text>

    <!-- Gauge Ring Simulation -->
    <circle cx="112" cy="100" r="48" fill="none" stroke="#f1f5f9" stroke-width="12"/>
    <circle cx="112" cy="100" r="48" fill="none" stroke="#ef4444" stroke-width="12" stroke-dasharray="270" stroke-dashoffset="40"/>
    <text x="96" y="106" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">96%</text>

    <text x="16" y="172" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Consensus: High Confidence Malicious</text>
    <rect x="16" y="184" width="193" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="24" y="202" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Action: Automated Domain Blacklist</text>
  </g>
</svg>
