<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none">
  <!-- Background -->
  <rect width="600" height="380" rx="20" fill="#f8fafc"/>
  <rect x="1" y="1" width="598" height="378" rx="19" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect width="600" height="42" rx="20" fill="#ffffff"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="25" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Loneix • AI Credit &amp; Loan Default Risk Intelligence (Vercel Live)</text>
  <rect x="470" y="10" width="112" height="22" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="480" y="25" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">VERCEL DEPLOYED</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DEFAULT PROBABILITY</text>
    <text x="14" y="48" fill="#16a34a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">4.2% (Low)</text>
    <rect x="115" y="32" width="45" height="18" rx="4" fill="#ecfdf5"/>
    <text x="122" y="44" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SAFE</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CREDIT RISK TIER</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Tier A+</text>
    <text x="280" y="44" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Score: 810</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MODEL ENSEMBLE</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Random Forest</text>
    <rect x="495" y="32" width="55" height="18" rx="4" fill="#eff6ff"/>
    <text x="502" y="44" fill="#2563eb" font-family="system-ui, sans-serif" font-size="9" font-weight="700">PIPELINE</text>
  </g>

  <!-- Left: Risk Factor Breakdown -->
  <g transform="translate(20, 134)">
    <rect width="320" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Financial Risk Assessment Factors</text>

    <g transform="translate(16, 46)">
      <!-- Factor 1 -->
      <text x="0" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Debt-to-Income Ratio (DTI: 18%)</text>
      <rect y="16" width="288" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="16" width="70" height="8" rx="4" fill="#10b981"/>

      <!-- Factor 2 -->
      <text x="0" y="46" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Credit History Length (7+ Years)</text>
      <rect y="52" width="288" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="52" width="240" height="8" rx="4" fill="#3b82f6"/>

      <!-- Factor 3 -->
      <text x="0" y="82" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Revolving Credit Utilization (12%)</text>
      <rect y="88" width="288" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="88" width="55" height="8" rx="4" fill="#10b981"/>

      <!-- Factor 4 -->
      <text x="0" y="118" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Delinquencies in past 24mo (0)</text>
      <rect y="124" width="288" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="124" width="280" height="8" rx="4" fill="#10b981"/>
    </g>

    <rect x="16" y="196" width="288" height="20" rx="6" fill="#ecfdf5"/>
    <text x="24" y="210" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Loan Underwriting Criteria Met • Low Risk Approved</text>
  </g>

  <!-- Right: Decision Confidence -->
  <g transform="translate(355, 134)">
    <rect width="225" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Automated Recommendation</text>

    <!-- Approved Badge Box -->
    <rect x="20" y="50" width="185" height="85" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="50" cy="92" r="18" fill="#10b981"/>
    <path d="M 44 92 L 48 96 L 56 88" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="78" y="86" fill="#065f46" font-family="system-ui, sans-serif" font-size="13" font-weight="800">APPROVED</text>
    <text x="78" y="102" fill="#047857" font-family="system-ui, sans-serif" font-size="9">Instant ML Decision</text>

    <rect x="16" y="150" width="193" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="166" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Model Threshold: 0.15</text>
    <text x="24" y="178" fill="#16a34a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Calculated Risk: 0.042</text>

    <rect x="16" y="196" width="193" height="20" rx="6" fill="#eff6ff"/>
    <text x="24" y="210" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">End-to-End Pipeline Active</text>
  </g>
</svg>
