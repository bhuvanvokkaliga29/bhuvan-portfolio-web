  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="25" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AML Mule Account Detection • RBIH × IIT Delhi National Challenge</text>
  <rect x="470" y="10" width="112" height="22" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="480" y="25" fill="#047857" font-family="system-ui, sans-serif" font-size="10" font-weight="700">0.9819 AUC-ROC</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PUBLIC LEADERBOARD</text>
    <text x="14" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">0.9819 AUC</text>
    <rect x="116" y="32" width="42" height="18" rx="4" fill="#dbeafe"/>
    <text x="122" y="44" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">TOP 1%</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">NATIONAL F1-SCORE</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">0.8247</text>
    <text x="290" y="44" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Private: 0.815</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">GRAPH FEATURES</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">130+ Features</text>
    <text x="492" y="44" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="700">OOF-SAFE</text>
  </g>

  <!-- Left: Graph Network Visualization -->
  <g transform="translate(20, 134)">
    <rect width="330" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Money Mule Transaction Graph</text>
    <text x="16" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Temporal transaction flow &amp; mule ring discovery</text>
    
    <!-- Graph Links -->
    <line x1="80" y1="120" x2="165" y2="85" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="165" y1="85" x2="250" y2="120" stroke="#f87171" stroke-width="2.5" stroke-dasharray="4"/>
    <line x1="165" y1="85" x2="165" y2="170" stroke="#f87171" stroke-width="3"/>
    <line x1="80" y1="120" x2="165" y2="170" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="165" y1="170" x2="250" y2="120" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="250" y1="120" x2="290" y2="180" stroke="#fca5a5" stroke-width="1.5"/>

