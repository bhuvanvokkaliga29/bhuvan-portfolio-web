    <text x="73" y="124" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">A1</text>

    <circle cx="165" cy="85" r="18" fill="#ef4444"/>
    <text x="156" y="89" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">M1</text>

    <circle cx="250" cy="120" r="16" fill="#f59e0b"/>
    <text x="242" y="124" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">M2</text>

    <circle cx="165" cy="170" r="18" fill="#dc2626"/>
    <text x="157" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">M3</text>

    <circle cx="290" cy="180" r="12" fill="#64748b"/>
    <text x="284" y="184" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">A4</text>

    <!-- Legend Tag -->
    <rect x="16" y="196" width="298" height="20" rx="6" fill="#fef2f2"/>
    <text x="24" y="210" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9" font-weight="700">⚠️ Clustered High-Velocity Mule Ring Detected (Risk Score: 98.4%)</text>
  </g>

  <!-- Right: SHAP Explainability & Model Validation -->
  <g transform="translate(365, 134)">
    <rect width="215" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SHAP Feature Importance</text>

    <!-- Bar 1 -->
    <text x="16" y="56" fill="#475569" font-family="system-ui, sans-serif" font-size="10">OOF In-Degree Centrality</text>
    <rect x="16" y="62" width="180" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="16" y="62" width="165" height="10" rx="5" fill="#ef4444"/>

    <!-- Bar 2 -->
    <text x="16" y="94" fill="#475569" font-family="system-ui, sans-serif" font-size="10">24h Velocity Spike Ratio</text>
    <rect x="16" y="100" width="180" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="16" y="100" width="142" height="10" rx="5" fill="#f59e0b"/>

    <!-- Bar 3 -->
    <text x="16" y="132" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Temporal Idle-to-Burst Delta</text>
    <rect x="16" y="138" width="180" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="16" y="138" width="118" height="10" rx="5" fill="#3b82f6"/>

    <!-- Bar 4 -->
    <text x="16" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Graph PageRank Rank</text>
    <rect x="16" y="176" width="180" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="16" y="176" width="94" height="10" rx="5" fill="#10b981"/>

    <rect x="16" y="196" width="183" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="210" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Model: LightGBM + XGBoost</text>
  </g>
