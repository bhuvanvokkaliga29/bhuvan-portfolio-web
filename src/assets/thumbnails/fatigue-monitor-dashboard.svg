<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none">
  <!-- Background -->
  <rect width="600" height="380" rx="20" fill="#f8fafc"/>
  <rect x="1" y="1" width="598" height="378" rx="19" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect width="600" height="42" rx="20" fill="#ffffff"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="25" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AI Fatigue Monitor • Real-Time Driver Drowsiness &amp; Safety CV System</text>
  <rect x="475" y="10" width="105" height="22" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="485" y="25" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">95% ACCURACY</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DRIVER FOCUS SCORE</text>
    <text x="14" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">92 / 100</text>
    <rect x="110" y="32" width="50" height="18" rx="4" fill="#ecfdf5"/>
    <text x="116" y="44" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ALERT</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">EYE ASPECT RATIO (EAR)</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">0.31 EAR</text>
    <text x="290" y="44" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" font-weight="600">&gt; 0.25 Threshold</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MOUTH ASPECT RATIO</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">0.14 MAR</text>
    <rect x="495" y="32" width="55" height="18" rx="4" fill="#ecfdf5"/>
    <text x="502" y="44" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">NO YAWN</text>
  </g>

  <!-- Left: Facial Landmark Regression Mesh -->
  <g transform="translate(20, 134)">
    <rect width="320" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OpenCV Facial Landmark Mesh</text>

    <!-- Face Silhouette with Eye/Mouth points -->
    <g transform="translate(60, 40)">
      <ellipse cx="100" cy="70" rx="65" ry="68" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Left Eye -->
      <path d="M 65 55 Q 75 48 85 55 Q 75 62 65 55" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="75" cy="55" r="3" fill="#2563eb"/>
      
      <!-- Right Eye -->
      <path d="M 115 55 Q 125 48 135 55 Q 125 62 115 55" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="125" cy="55" r="3" fill="#2563eb"/>

      <!-- Nose Line -->
      <line x1="100" y1="58" x2="100" y2="78" stroke="#94a3b8" stroke-width="2"/>

      <!-- Mouth (Closed / Normal) -->
      <path d="M 80 95 Q 100 102 120 95 Q 100 96 80 95" fill="#f1f5f9" stroke="#10b981" stroke-width="2"/>

      <!-- Bounding Box -->
      <rect x="25" y="-5" width="150" height="150" rx="10" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6"/>
      <text x="32" y="8" fill="#059669" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Driver Face #01 [99.2%]</text>
    </g>

    <rect x="16" y="196" width="288" height="20" rx="6" fill="#ecfdf5"/>
    <text x="24" y="210" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Status: Driver Awake &amp; Attentive • Real-Time 30 FPS Tracking</text>
  </g>

  <!-- Right: EAR Real-Time Oscilloscope -->
  <g transform="translate(355, 134)">
    <rect width="225" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EAR Waveform Analysis</text>

    <!-- Chart -->
    <path d="M 16 110 L 40 108 L 60 112 L 80 155 L 95 110 L 130 110 L 150 158 L 165 108 L 205 110" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <!-- Threshold line -->
    <line x1="16" y1="135" x2="205" y2="135" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="16" y="148" fill="#dc2626" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Drowsy Threshold (EAR &lt; 0.25)</text>

    <rect x="16" y="160" width="193" height="24" rx="6" fill="#eff6ff"/>
    <text x="24" y="176" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Blinks: 16/min (Healthy)</text>

    <rect x="16" y="194" width="193" height="22" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="24" y="209" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Voice Alert: Armed (Sub-50ms latency)</text>
  </g>
</svg>
