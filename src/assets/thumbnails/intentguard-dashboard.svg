  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">AUTONOMOUS VOLUME</text>
    <text x="14" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">$284,500</text>
    <rect x="118" y="32" width="40" height="18" rx="4" fill="#eff6ff"/>
    <text x="124" y="44" fill="#2563eb" font-family="system-ui, sans-serif" font-size="9" font-weight="700">LIVE</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">POLICY APPROVAL RATE</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">99.4%</text>
    <rect x="290" y="32" width="55" height="18" rx="4" fill="#ecfdf5"/>
    <text x="296" y="44" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ENFORCED</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">BLOCKED ANOMALIES</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">14 Attacks</text>
    <rect x="495" y="32" width="55" height="18" rx="4" fill="#fef2f2"/>
    <text x="502" y="44" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SHIELDED</text>
  </g>

  <!-- Left: Autonomous Policy Execution Pipeline -->
  <g transform="translate(20, 134)">
    <rect width="320" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Autonomous Intent Control Pipeline</text>

    <!-- Pipeline Steps -->
    <g transform="translate(16, 42)">
      <!-- Step 1 -->
      <rect width="288" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="20" cy="21" r="10" fill="#3b82f6"/>
      <text x="16" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">1</text>
      <text x="38" y="19" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI Agent Intent Ingestion</text>
      <text x="38" y="33" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Autonomous payment trigger received ($4,200.00)</text>

      <!-- Step 2 -->
      <rect y="48" width="288" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="20" cy="69" r="10" fill="#10b981"/>
      <text x="16" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">2</text>
      <text x="38" y="67" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Policy Rules &amp; Limit Checks</text>
      <text x="38" y="81" fill="#047857" font-family="system-ui, sans-serif" font-size="9">✓ Whitelisted vendor • Within daily velocity threshold</text>

      <!-- Step 3 -->
      <rect y="96" width="288" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="20" cy="117" r="10" fill="#8b5cf6"/>
      <text x="16" y="121" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">3</text>
      <text x="38" y="115" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Consensus &amp; Settlement Gate</text>
      <text x="38" y="129" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Signed cryptographic audit payload emitted</text>
    </g>

    <rect x="16" y="196" width="288" height="20" rx="6" fill="#ecfdf5"/>
    <text x="24" y="210" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Autonomous Execution Authorized • Transaction Settled</text>
