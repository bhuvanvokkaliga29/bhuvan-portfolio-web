      <circle cx="16" cy="17" r="5" fill="#10b981"/>
      <text x="28" y="16" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Max Single Txn</text>
      <text x="28" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Cap: $10,000 / txn</text>
    </g>

    <!-- Guardrail 2 -->
    <g transform="translate(16, 84)">
      <rect width="193" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="16" cy="17" r="5" fill="#10b981"/>
      <text x="28" y="16" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Velocity Throttling</text>
      <text x="28" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Max 5 requests/sec</text>
    </g>

    <!-- Guardrail 3 -->
    <g transform="translate(16, 124)">
      <rect width="193" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="16" cy="17" r="5" fill="#ef4444"/>
      <text x="28" y="16" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Off-Hours Execution</text>
      <text x="28" y="28" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9">Requires Multi-Sig Approval</text>
    </g>

    <rect x="16" y="176" width="193" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="24" y="192" fill="#1e40af" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Razorpay API Integration</text>
    <text x="24" y="206" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9">Webhook verification active</text>
  </g>
</svg>

