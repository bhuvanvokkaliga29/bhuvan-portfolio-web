<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none">
  <!-- Background -->
  <rect width="600" height="380" rx="20" fill="#f8fafc"/>
  <rect x="1" y="1" width="598" height="378" rx="19" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect width="600" height="42" rx="20" fill="#ffffff"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="25" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sanchara Vyuha • AI Smart Bus Depot (IoTopia 2025 1st Runner-Up)</text>
  <rect x="460" y="10" width="122" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="468" y="25" fill="#b45309" font-family="system-ui, sans-serif" font-size="9" font-weight="700">🥈 1ST RUNNER-UP</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(20, 56)">
    <!-- Metric 1 -->
    <rect width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ACTIVE FLEET</text>
    <text x="14" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">48 Buses</text>
    <rect x="108" y="32" width="50" height="18" rx="4" fill="#ecfdf5"/>
    <text x="114" y="44" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">OPTIMAL</text>

    <!-- Metric 2 -->
    <rect x="185" width="170" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PASSENGER COUNT (YOLO)</text>
    <text x="199" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">3,420 /hr</text>
    <text x="290" y="44" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Peak Load</text>

    <!-- Metric 3 -->
    <rect x="370" width="190" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="384" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CO₂ EMISSION SAVED</text>
    <text x="384" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">-18.4%</text>
    <rect x="495" y="32" width="55" height="18" rx="4" fill="#ecfdf5"/>
    <text x="502" y="44" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">GREEN AI</text>
  </g>

  <!-- Left: Depot Bay Live Occupancy -->
  <g transform="translate(20, 134)">
    <rect width="320" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Depot Bay Status &amp; YOLOv8 Vision</text>
    
    <!-- Bay Grid -->
    <g transform="translate(16, 42)">
      <!-- Bay 1 -->
      <rect width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Bay 01 • Route 335E</text>
      <text x="10" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Occupancy: 88%</text>
      <rect x="10" y="46" width="116" height="8" rx="4" fill="#fca5a5"/>
      <rect x="10" y="46" width="102" height="8" rx="4" fill="#ef4444"/>

      <!-- Bay 2 -->
      <rect x="150" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="160" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Bay 02 • Route 500D</text>
      <text x="160" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Occupancy: 42%</text>
      <rect x="160" y="46" width="116" height="8" rx="4" fill="#bbf7d0"/>
      <rect x="160" y="46" width="48" height="8" rx="4" fill="#10b981"/>

      <!-- Bay 3 -->
      <rect y="78" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="98" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Bay 03 • Route 201R</text>
      <text x="10" y="116" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Occupancy: 64%</text>
      <rect x="10" y="124" width="116" height="8" rx="4" fill="#fef08a"/>
      <rect x="10" y="124" width="74" height="8" rx="4" fill="#eab308"/>

      <!-- Bay 4 -->
      <rect x="150" y="78" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="160" y="98" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Bay 04 • Express 12</text>
      <text x="160" y="116" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Occupancy: 15%</text>
      <rect x="160" y="124" width="116" height="8" rx="4" fill="#bbf7d0"/>
      <rect x="160" y="124" width="18" height="8" rx="4" fill="#10b981"/>
    </g>

    <rect x="16" y="196" width="288" height="20" rx="6" fill="#eff6ff"/>
    <text x="24" y="210" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">GCP Stream: Live Dispatch Frequency +2 Buses to Bay 01</text>
  </g>

  <!-- Right: LSTM Demand Curve -->
  <g transform="translate(355, 134)">
    <rect width="225" height="226" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LSTM Demand Forecasting</text>
    <text x="16" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Predicted vs Real-time Rush</text>

    <!-- Curve Graph -->
    <path d="M 20 160 Q 60 70 110 110 T 170 80 T 210 140" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
    <path d="M 20 160 Q 60 70 110 110 T 170 80 T 210 140" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 165 Q 60 85 110 115 T 170 95 T 210 145" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" stroke-linecap="round"/>

    <!-- Marker -->
    <circle cx="170" cy="80" r="5" fill="#3b82f6"/>
    <rect x="135" y="52" width="70" height="20" rx="4" fill="#1e293b"/>
    <text x="141" y="66" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Surge +45%</text>

    <text x="20" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">08:00 AM</text>
    <text x="95" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">12:00 PM</text>
    <text x="175" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">06:00 PM</text>

    <rect x="16" y="196" width="193" height="20" rx="6" fill="#ecfdf5"/>
    <text x="24" y="210" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Peak Congestion Mitigated</text>
  </g>
</svg>

